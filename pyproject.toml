[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "embody-data-infrastructure"
version = "0.1.0"
description = "Phase 1 processing foundation for robotics and embodied AI data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Embody Data Infrastructure contributors" }]
dependencies = [
  "huggingface-hub>=0.27",
  "mcap>=1.2",
  "mcap-protobuf-support>=0.5",
  "protobuf>=5.28",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
yaml = ["PyYAML>=6.0"]
video = ["av>=13.0"]

[project.scripts]
embody-data = "embody_data.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/embody_data"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["embody_data"]
